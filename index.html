<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tumhari Yaad 💕</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overflow:hidden; height:100%; font-family:'Segoe UI',sans-serif; background:#0a0a1a; color:#fff; overscroll-behavior:none; }

  /* UPLOAD SCREEN */
  #upload-screen {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px;
    background:radial-gradient(circle at 30% 20%, #3a1c4a, #0a0a1a 70%);
    z-index:100;
  }
  #upload-screen h1 {
    font-size:2.4rem; margin-bottom:10px;
    background:linear-gradient(90deg,#ff5e9c,#ffb86c);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #upload-screen p { color:#ccc; margin-bottom:25px; }

  /* EXACT SAME BUTTON AS FIRST VERSION */
  .upload-btn {
    padding:16px 36px; border-radius:50px; cursor:pointer;
    background:linear-gradient(90deg,#ff5e9c,#a855f7);
    font-size:1.1rem; font-weight:600; transition:.3s;
    box-shadow:0 8px 24px rgba(255,94,156,.4); display:inline-block;
  }
  .upload-btn:hover { transform:translateY(-3px); }

  #preview { margin-top:18px; max-width:180px; max-height:180px; border-radius:12px; display:none; object-fit:cover; }

  #startBtn {
    margin-top:22px; padding:14px 42px; border:none; border-radius:50px;
    background:linear-gradient(90deg,#22c55e,#16a34a); color:#fff;
    font-size:1rem; font-weight:700; cursor:pointer;
    box-shadow:0 8px 24px rgba(34,197,94,.4);
    opacity:0; pointer-events:none; transition:.3s;
  }
  #startBtn.show { opacity:1; pointer-events:auto; }

  /* GAME SCREEN */
  #game-screen { display:none; position:fixed; inset:0; overflow:hidden; touch-action:none; }
  #bg-layer {
    position:absolute; inset:0;
    background:linear-gradient(135deg,#3a1c4a,#1a1a3a);
    background-size:cover; background-position:center;
    filter:brightness(.72) saturate(1.15);
    transition:background-image .5s;
  }
  #bg-layer::after {
    content:''; position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(10,5,20,.75) 100%);
    pointer-events:none;
  }

  .character {
    position:absolute; top:0; left:0; width:60px; height:100px; z-index:5;
    pointer-events:none; will-change:transform;
  }
  .character svg { width:100%; height:100%; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); }

  #girl.blushing::before {
    content:''; position:absolute; width:110px; height:110px; top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,126,182,.55) 0%, transparent 70%);
    border-radius:50%; animation:blushPulse 1.3s ease-in-out infinite; z-index:-1;
  }
  @keyframes blushPulse {
    0%,100% { transform:translate(-50%,-50%) scale(1); opacity:.7; }
    50%     { transform:translate(-50%,-50%) scale(1.35); opacity:1; }
  }

  .float-heart {
    position:absolute; font-size:1.6rem; pointer-events:none; z-index:8;
    animation:floatUp 1.8s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity:0; transform:translateY(0) scale(.5); }
    20%  { opacity:1; }
    100% { opacity:0; transform:translateY(-90px) scale(1.4); }
  }

  .heart-item {
    position:absolute; font-size:2.2rem; z-index:4;
    animation:heartBob 2s ease-in-out infinite;
    filter:drop-shadow(0 0 14px rgba(255,94,156,.9));
    will-change:transform; pointer-events:none;
  }
  @keyframes heartBob {
    0%,100% { transform:translateY(0) rotate(-5deg); }
    50%     { transform:translateY(-12px) rotate(5deg); }
  }

  #ui-top {
    position:absolute; top:15px; left:15px; right:15px;
    display:flex; justify-content:space-between; align-items:flex-start;
    z-index:20; pointer-events:none;
  }
  .ui-pill {
    background:rgba(0,0,0,.72); padding:10px 18px; border-radius:50px;
    font-size:.95rem; font-weight:600;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1.5px solid rgba(255,126,182,.55);
    display:flex; align-items:center; gap:8px;
  }
  #loveVal { color:#ff7eb6; }
  #heartsCount { color:#ff5e9c; }
  #love-bar-wrap {
    position:absolute; top:60px; left:15px; width:min(200px,40vw); height:6px;
    background:rgba(0,0,0,.5); border-radius:10px; overflow:hidden;
    z-index:20; border:1px solid rgba(255,126,182,.3);
  }
  #love-bar-fill {
    height:100%; width:0%;
    background:linear-gradient(90deg,#ff5e9c,#ffb86c);
    transition:width .3s; border-radius:10px;
  }

  #interact-prompt {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    padding:14px 28px; border-radius:50px;
    background:linear-gradient(135deg,#ff5e9c,#a855f7);
    font-weight:700; font-size:1rem; color:#fff; border:none; cursor:pointer;
    display:none; z-index:20;
    box-shadow:0 8px 24px rgba(255,94,156,.55);
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform:translateX(-50%) scale(1); }
    50%     { transform:translateX(-50%) scale(1.08); }
  }

  #dialog-bubble {
    position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
    background:rgba(20,10,30,.95); backdrop-filter:blur(15px);
    padding:14px 22px; border-radius:20px; border:2px solid #ff7eb6;
    max-width:min(90vw, 380px); z-index:25; display:none; text-align:center;
    font-size:.98rem; animation:bubbleIn .3s ease-out;
  }
  @keyframes bubbleIn {
    from { opacity:0; transform:translateX(-50%) translateY(10px) scale(.9); }
    to   { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }

  #joystick {
    position:absolute; bottom:30px; left:30px; width:110px; height:110px;
    border-radius:50%; background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3);
    display:none; z-index:15; touch-action:none;
  }
  #joystick-knob {
    position:absolute; width:50px; height:50px; border-radius:50%;
    background:rgba(255,126,182,.85); top:50%; left:50%;
    transform:translate(-50%,-50%); box-shadow:0 2px 8px rgba(0,0,0,.4);
    pointer-events:none;
  }

  #hint {
    position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,.55); font-size:.78rem; text-align:center;
    z-index:10; pointer-events:none; transition:opacity 1s;
  }

  #ending-screen {
    display:none; position:absolute; inset:0; z-index:50;
    background:rgba(10,5,20,.95); backdrop-filter:blur(15px);
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px;
  }
  #ending-screen h1 {
    font-size:2.2rem; margin-bottom:15px; color:#ff7eb6;
    animation:glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { text-shadow:0 0 20px rgba(255,126,182,.6); }
    50%     { text-shadow:0 0 40px rgba(255,126,182,1); }
  }
  #ending-screen p { color:#ddd; max-width:500px; margin-bottom:25px; line-height:1.7; }
  #ending-screen button {
    padding:14px 40px; border:none; border-radius:50px; cursor:pointer;
    background:linear-gradient(90deg,#ff5e9c,#a855f7); color:#fff;
    font-size:1rem; font-weight:700;
  }

  @media (max-width:600px) {
    #joystick { display:block; }
    #hint { font-size:.7rem; }
    #upload-screen h1 { font-size:1.8rem; }
    .character { width:50px; height:85px; }
  }
</style>
</head>
<body>

<!-- UPLOAD SCREEN (SAME AS FIRST WORKING CODE) -->
<div id="upload-screen">
  <h1>Tumhari Yaad 💕</h1>
  <p>Uski photo daalo... aur usse milne chalo</p>

  <!-- Wahi label aur hidden input jo pehle kaam kiya tha -->
  <label class="upload-btn">
    📸 Uski Photo Chuno
    <input type="file" id="bgUpload" accept="image/*" hidden>
  </label>

  <img id="preview" alt="">
  <button id="startBtn">Khelna Shuru Karo →</button>
</div>

<!-- GAME SCREEN -->
<div id="game-screen">
  <div id="bg-layer"></div>

  <div id="boy" class="character">
    <svg viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="30" cy="96" rx="18" ry="4" fill="rgba(0,0,0,.5)"/>
      <rect x="22" y="72" width="6" height="20" rx="3" fill="#1f2937"/>
      <rect x="32" y="72" width="6" height="20" rx="3" fill="#1f2937"/>
      <rect x="18" y="42" width="24" height="35" rx="8" fill="#4a90e2"/>
      <rect x="10" y="45" width="10" height="25" rx="5" fill="#4a90e2"/>
      <rect x="40" y="45" width="10" height="25" rx="5" fill="#4a90e2"/>
      <circle cx="15" cy="70" r="5" fill="#fdbcb4"/>
      <circle cx="45" cy="70" r="5" fill="#fdbcb4"/>
      <circle cx="30" cy="28" r="18" fill="#fdbcb4"/>
      <path d="M12 22 Q14 8 30 6 Q46 8 48 22 Q44 14 30 12 Q16 14 12 22 Z" fill="#2d1b0e"/>
      <circle cx="23" cy="28" r="2.5" fill="#111"/>
      <circle cx="37" cy="28" r="2.5" fill="#111"/>
      <path d="M25 36 Q30 40 35 36" stroke="#c14b3b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="19" cy="34" r="3" fill="#ffb3b3" opacity=".6"/>
      <circle cx="41" cy="34" r="3" fill="#ffb3b3" opacity=".6"/>
    </svg>
  </div>

  <div id="girl" class="character">
    <svg viewBox="0 0 60 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="30" cy="96" rx="18" ry="4" fill="rgba(0,0,0,.5)"/>
      <rect x="22" y="72" width="6" height="20" rx="3" fill="#fdbcb4"/>
      <rect x="32" y="72" width="6" height="20" rx="3" fill="#fdbcb4"/>
      <path d="M18 42 L42 42 L46 72 L14 72 Z" fill="#ff7eb6"/>
      <rect x="10" y="45" width="10" height="25" rx="5" fill="#fdbcb4"/>
      <rect x="40" y="45" width="10" height="25" rx="5" fill="#fdbcb4"/>
      <circle cx="30" cy="28" r="17" fill="#fdbcb4"/>
      <path d="M13 28 Q11 10 30 6 Q49 10 47 28 L50 58 Q46 52 45 40 L45 28 Q40 15 30 12 Q20 15 15 28 L15 40 Q14 52 10 58 Z" fill="#5a2e1a"/>
      <circle cx="23" cy="28" r="2.5" fill="#111"/>
      <circle cx="37" cy="28" r="2.5" fill="#111"/>
      <path d="M26 35 Q30 39 34 35" stroke="#c14b3b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="19" cy="33" r="3" fill="#ff8aa8" opacity=".7"/>
      <circle cx="41" cy="33" r="3" fill="#ff8aa8" opacity=".7"/>
    </svg>
  </div>

  <div id="hearts-container"></div>
  <div id="fx-container"></div>

  <div id="ui-top">
    <div class="ui-pill">💖 <span id="loveVal">0</span>%</div>
    <div class="ui-pill">💝 <span id="heartsCount">0</span></div>
  </div>
  <div id="love-bar-wrap"><div id="love-bar-fill"></div></div>

  <button id="interact-prompt">💕 Tap — Dil Do</button>
  <div id="dialog-bubble"></div>

  <div id="joystick"><div id="joystick-knob"></div></div>
  <div id="hint">Joystick se chalao | Dil dene ke liye Tap karo</div>

  <div id="ending-screen">
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button onclick="location.reload()">Phir Se Khelo 🔁</button>
  </div>
</div>

<script>
const game = {
  love: 0, heartsHeld: 0,
  player: { x:0, y:0, speed:4.2, facingLeft:false, walking:false },
  girl:   { x:0, y:0, speed:1.6, facingLeft:false, walking:false,
            state:'idle', stateTimer:60, target:null, blushing:false },
  collectibles: [], keys: {},
  screenW:0, screenH:0, charW:60, charH:100,
  running:false, lastTime:0, spawnTimer:0, nextSpawn:130, endingShown:false
};
let time = 0;

const $ = id => document.getElementById(id);
const boyEl = $('boy'), girlEl = $('girl'), bgEl = $('bg-layer');
const heartsContainer = $('hearts-container'), fxContainer = $('fx-container');

const giftResponses = [
  "Yeh... mere liye? 🥺", "*sharma ke* Thank you...",
  "Tum bahut acche ho 💕", "Mera dil khush ho gaya...",
  "Aur laao na... please 😊", "Tumhare saath achha lagta hai",
  "Main... tumhare paas rehna chahti hoon", "Yeh pyar sach hai na?",
  "Tumhari yaad aati hai mujhe bhi", "Bas tum saath raho... 🥰"
];
const blushSays = [
  "*sharma ke dekhti hai*", "Tum bahut paas ho...",
  "Mera dil dhadak raha hai...", "Kya dekh rahe ho?", "Bas... paas mat aao 😳"
];

/* ================= 100% WORKING UPLOAD LOGIC ================= */
$('bgUpload').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    const dataUrl = ev.target.result;
    $('preview').src = dataUrl;
    $('preview').style.display = 'block';
    bgEl.style.backgroundImage = `url(${dataUrl})`;
    $('startBtn').classList.add('show');
  };
  reader.readAsDataURL(file);
});

$('startBtn').addEventListener('click', () => {
  $('upload-screen').style.display = 'none';
  $('game-screen').style.display = 'block';
  requestAnimationFrame(startGame);
});

function startGame() {
  game.screenW = $('game-screen').offsetWidth || document.documentElement.clientWidth;
  game.screenH = $('game-screen').offsetHeight || document.documentElement.clientHeight;
  game.charW = boyEl.offsetWidth || 60;
  game.charH = boyEl.offsetHeight || 100;

  game.player.x = game.screenW * 0.2;
  game.player.y = game.screenH * 0.55;
  game.girl.x   = game.screenW * 0.7;
  game.girl.y   = game.screenH * 0.55;

  for (let i = 0; i < 3; i++) spawnCollectible();

  game.running = true;
  game.lastTime = performance.now();
  requestAnimationFrame(gameLoop);
  setTimeout(() => { $('hint').style.opacity = '0'; }, 6000);
}

function gameLoop(t) {
  if (!game.running) return;
  time = t;
  const dt = Math.min((t - game.lastTime) / 16.67, 3);
  game.lastTime = t;
  updatePlayer(dt);
  updateGirl(dt);
  updateCollectibles(dt);
  updateProximity();
  updateUI();
  requestAnimationFrame(gameLoop);
}

function updatePlayer(dt) {
  const p = game.player;
  let dx = 0, dy = 0;
  if (game.keys['ArrowLeft']  || game.keys['a'] || game.keys['A']) dx--;
  if (game.keys['ArrowRight'] || game.keys['d'] || game.keys['D']) dx++;
  if (game.keys['ArrowUp']    || game.keys['w'] || game.keys['W']) dy--;
  if (game.keys['ArrowDown']  || game.keys['s'] || game.keys['S']) dy++;
  if (joystick.active) { dx += joystick.dx; dy += joystick.dy; }
  if (dx && dy) { const l = Math.hypot(dx,dy); dx/=l; dy/=l; }
  p.walking = (dx !== 0 || dy !== 0);
  if (dx < 0) p.facingLeft = true; else if (dx > 0) p.facingLeft = false;
  p.x = Math.max(0, Math.min(game.screenW - game.charW, p.x + dx * p.speed * dt));
  p.y = Math.max(80, Math.min(game.screenH - game.charH - 20, p.y + dy * p.speed * dt));
  const bob = p.walking ? Math.abs(Math.sin(time * 0.012)) * 3 : 0;
  boyEl.style.transform = `translate3d(${p.x}px, ${p.y + bob}px, 0) scaleX(${p.facingLeft ? -1 : 1})`;
}

function updateGirl(dt) {
  const g = game.girl, p = game.player;
  const dx = p.x - g.x, dy = p.y - g.y;
  const dist = Math.hypot(dx, dy);
  g.walking = false;
  g.stateTimer -= dt;

  if (dist < 110 && game.love > 20) {
    g.state = 'blush';
    g.facingLeft = dx < 0;
    g.blushing = true;
    game.love = Math.min(100, game.love + 0.015 * dt);
    if (Math.random() < 0.015 * dt) spawnFloatHeart(g.x + game.charW/2, g.y);
    if (Math.random() < 0.003 * dt) showDialog(blushSays[Math.floor(Math.random() * blushSays.length)]);
  } else if (dist < 280) {
    g.state = 'notice'; g.facingLeft = dx < 0; g.blushing = false;
  } else if (game.love > 50 && dist < 480) {
    g.state = 'follow'; g.blushing = false;
    if (dist > 90) {
      const m = g.speed * dt;
      g.x += (dx/dist) * m; g.y += (dy/dist) * m;
      g.walking = true; g.facingLeft = dx < 0;
    }
  } else {
    g.blushing = false;
    if (g.stateTimer <= 0) {
      if (Math.random() < 0.55) {
        g.state = 'idle'; g.stateTimer = 80 + Math.random() * 120;
      } else {
        g.state = 'wander';
        g.target = {
          x: 80 + Math.random() * (game.screenW - 160),
          y: 140 + Math.random() * (game.screenH - 320)
        };
        g.stateTimer = 220;
      }
    }
    if (g.state === 'wander' && g.target) {
      const tx = g.target.x - g.x, ty = g.target.y - g.y;
      const td = Math.hypot(tx, ty);
      if (td > 10) {
        const m = g.speed * dt;
        g.x += (tx/td) * m; g.y += (ty/td) * m;
        g.walking = true; g.facingLeft = tx < 0;
      } else { g.target = null; g.state = 'idle'; g.stateTimer = 60; }
    }
  }

  g.x = Math.max(0, Math.min(game.screenW - game.charW, g.x));
  g.y = Math.max(80, Math.min(game.screenH - game.charH - 20, g.y));

  const bob = g.walking ? Math.abs(Math.sin(time * 0.012 + 1)) * 3 : 0;
  girlEl.style.transform = `translate3d(${g.x}px, ${g.y + bob}px, 0) scaleX(${g.facingLeft ? -1 : 1})`;
  girlEl.classList.toggle('blushing', g.blushing);
}

function spawnCollectible() {
  const el = document.createElement('div');
  el.className = 'heart-item';
  el.textContent = ['💖','💕','❤️','💗'][Math.floor(Math.random()*4)];
  const x = 60 + Math.random() * (game.screenW - 120);
  const y = 130 + Math.random() * (game.screenH - 300);
  el.style.left = x + 'px'; el.style.top = y + 'px';
  heartsContainer.appendChild(el);
  game.collectibles.push({ x, y, el });
}

function updateCollectibles(dt) {
  game.spawnTimer += dt;
  if (game.spawnTimer >= game.nextSpawn && game.collectibles.length < 6) {
    game.spawnTimer = 0; spawnCollectible();
  }
  const px = game.player.x + game.charW/2;
  const py = game.player.y + game.charH/2;
  for (let i = game.collectibles.length - 1; i >= 0; i--) {
    const h = game.collectibles[i];
    if (Math.hypot(px - (h.x + 18), py - (h.y + 18)) < 45) {
      h.el.remove(); game.collectibles.splice(i, 1);
      game.heartsHeld++; spawnFloatHeart(h.x + 18, h.y);
    }
  }
}

function updateProximity() {
  const p = game.player, g = game.girl;
  const dist = Math.hypot(
    (p.x + game.charW/2) - (g.x + game.charW/2),
    (p.y + game.charH/2) - (g.y + game.charH/2)
  );
  const prompt = $('interact-prompt');
  if (dist < 140 && game.heartsHeld > 0) prompt.style.display = 'block';
  else prompt.style.display = 'none';
  if (game.love >= 100 && !game.endingShown) showEnding();
}

function giveHeart() {
  if (game.heartsHeld <= 0 || game.love >= 100) return;
  const p = game.player, g = game.girl;
  const dist = Math.hypot(
    (p.x + game.charW/2) - (g.x + game.charW/2),
    (p.y + game.charH/2) - (g.y + game.charH/2)
  );
  if (dist > 140) return;
  game.heartsHeld--;
  game.love = Math.min(100, game.love + 12);
  showDialog(giftResponses[Math.floor(Math.random() * giftResponses.length)]);
  spawnFloatHeart(g.x + game.charW/2, g.y);
  spawnFloatHeart(g.x + game.charW/2 + 22, g.y + 20);
  spawnFloatHeart(g.x + game.charW/2 - 22, g.y + 20);
}

let dialogTimer = null;
function showDialog(text) {
  const el = $('dialog-bubble');
  el.textContent = text;
  el.style.display = 'block';
  el.style.animation = 'none'; void el.offsetHeight;
  el.style.animation = 'bubbleIn .3s ease-out';
  clearTimeout(dialogTimer);
  dialogTimer = setTimeout(() => el.style.display = 'none', 2200);
}

function spawnFloatHeart(x, y) {
  const el = document.createElement('div');
  el.className = 'float-heart';
  el.textContent = ['💖','💕','❤️','💗'][Math.floor(Math.random()*4)];
  el.style.left = x + 'px'; el.style.top = y + 'px';
  fxContainer.appendChild(el);
  setTimeout(() => el.remove(), 1900);
}

function updateUI() {
  $('loveVal').textContent = Math.floor(game.love);
  $('love-bar-fill').style.width = game.love + '%';
  $('heartsCount').textContent = game.heartsHeld;
}

function showEnding() {
  game.endingShown = true; game.running = false;
  $('endTitle').textContent = '💕 Happily Ever After';
  $('endText').textContent =
    'Tumne usse dil se dil ka rishta jod diya. Woh muskurayi, tum muskuraye... ' +
    'aur us din ke baad, har pal saath bitaya. Woh yaad, ab hamesha ke liye ' +
    'tumhari kahani ban gayi. ❤️';
  $('ending-screen').style.display = 'flex';
  for (let i = 0; i < 22; i++) {
    setTimeout(() => spawnFloatHeart(
      game.screenW/2 + (Math.random()-.5)*420,
      game.screenH/2 + (Math.random()-.5)*320
    ), i * 100);
  }
